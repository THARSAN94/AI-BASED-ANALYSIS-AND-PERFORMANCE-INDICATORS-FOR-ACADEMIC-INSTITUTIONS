# Render deployment blueprint
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: academic-approval-eligibility-analysis
    runtime: node
    plan: free
    region: singapore # change to your preferred Render region (e.g. oregon, frankfurt)
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # set this once in the Render dashboard (Secret)
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret at creation
      - key: APP_URL
        value: "https://REPLACE-WITH-YOUR-RENDER-APP.onrender.com"
